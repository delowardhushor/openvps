name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: for f in scripts/*.sh scripts/ci/*.sh packaging/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh scripts/ci/*.sh packaging/*.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  install:
    name: Package and install smoke test
    runs-on: ubuntu-24.04
    needs: [test, scripts]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build package
        run: bash scripts/package-release.sh
      - name: Install from package
        run: sudo bash scripts/install.sh --package release/openvps-*.tar.gz --yes
      - name: Verify
        run: |
          sudo openvps status
          curl -fsk https://127.0.0.1:7443/api/health
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:7443/api/system/overview)" = 401
          sudo openvps setup-token >/dev/null
      - name: Applications end-to-end (real systemd + real PM2)
        run: bash scripts/ci/apps-e2e.sh
      - name: Sites and certificates end-to-end (real Nginx + Certbot + Pebble test CA)
        run: bash scripts/ci/sites-e2e.sh
      - name: Backups end-to-end (real S3 server + MongoDB + the agent's systemd sandbox)
        timeout-minutes: 15
        run: bash scripts/ci/backups-e2e.sh
      - name: File manager end-to-end (the agent's helper acting as the apps user)
        run: bash scripts/ci/files-e2e.sh
      - name: Reinstall-upgrade with rollback path exercised
        run: sudo openvps upgrade --package release/openvps-*.tar.gz --reinstall --yes
      - name: Uninstall
        run: |
          sudo openvps uninstall --purge --yes --no-backup
          test ! -e /opt/openvps
          # Websites keep running; only the panel's own domain is removed.
          test -e /etc/nginx/sites-enabled/openvps-admin.conf
          test ! -e /etc/nginx/sites-enabled/openvps-panel.conf
          test -d /var/lib/openvps-agent/acme
          sudo nginx -t
      - name: Service logs on failure
        if: failure()
        run: |
          sudo journalctl -u openvps -n 100 --no-pager || true
          sudo journalctl -u openvps-agent -n 100 --no-pager || true
          sudo journalctl -u openvps-apps -n 100 --no-pager || true
          sudo tail -n 80 /var/log/letsencrypt/letsencrypt.log || true
          sudo journalctl -u pebble -n 50 --no-pager || true
          sudo journalctl -u ovps-ci-s3 -n 50 --no-pager || true
          sudo journalctl -u mongod -n 50 --no-pager || true
