name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check tag matches package version
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != package.json $v"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build package
        run: bash scripts/package-release.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/openvps-*.tar.gz release/openvps-*.tar.gz.sha256 \
            --title "OpenVPS ${GITHUB_REF_NAME}" --generate-notes --verify-tag \
            $( [[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease )
